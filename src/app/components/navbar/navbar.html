
<header class="navbar-container">

  <div class="navbar-content">

    <!-- Logo and Name -->
    <a routerLink="/about" class="brand" (click)="closeMenu()">

      <div class="logo">HG</div>

      <div class="brand-name">
        <h2>HARINI G</h2>
        <span>FULL STACK DEVELOPER</span>
      </div>

    </a>
    

    <!-- Mobile Menu Button -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle navigation">

      <i [class]="isMenuOpen ? 'bi bi-x-lg' : 'bi bi-list'"></i>

    </button>

    <!-- Navigation Links -->
    <nav class="nav-links" [class.open]="isMenuOpen">

      <a routerLink="/about"
         routerLinkActive="active"
         (click)="closeMenu()">
        About
      </a>

      <a routerLink="/skills"
         routerLinkActive="active"
         (click)="closeMenu()">
        Skills
      </a>

      <a routerLink="/projects"
         routerLinkActive="active"
         (click)="closeMenu()">
        Projects
      </a>

      <a routerLink="/experience"
         routerLinkActive="active"
         (click)="closeMenu()">
        Experience
      </a>

      <a routerLink="/contact"
         routerLinkActive="active"
         (click)="closeMenu()">
        Contact
      </a>

      <a routerLink="/contact" class="hire-button">
  Hire Me
  <i class="bi bi-arrow-up-right"></i>
</a>

    </nav>

  </div>

</header>
